name: New Relic Deployment Marker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  newrelic:
    runs-on: ubuntu-latest
    name: New Relic Deployment Marker Job
    steps:
      # Obtener el tag o branch como versión
      - name: Set Release Version
        run: echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      # Crear marcador de despliegue
      - name: Create Deployment Marker in New Relic
        uses: newrelic/deployment-marker-action@v2.2.0
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          region: "US"
          guid: ${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
          version: "${{ env.RELEASE_VERSION }}"
          user: "${{ github.actor }}"
          commit: "${{ github.sha }}"
          description: "Deploy triggered via GitHub Actions on push to main"